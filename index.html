<title>Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Comfortaa:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F7F2; --surface:#FFFEFB; --surface-2:#F2F0E9; --ink:#34404A; --ink-soft:#7A8288; --line:#E7E3D8;
  --mint:#49E8CC; --mint-soft:#DDF8F2; --teal:#2E7B8D; --teal-ink:#1D5C5A; --mint-glow:0 6px 18px -6px rgba(73,232,204,.55);
  --blush-line:#D9A5AE; --blush-ink:#A15C6A; --blush-bg:#FCF3F4;
  --sage-bg:#E9EEE4; --sage-line:#A9C0A2; --danger:#B8566A;
  --shadow:0 1px 2px rgba(52,64,74,.04),0 8px 22px -14px rgba(52,64,74,.22);
  /* pastel skill palette: background / ink */
  --speaking:#FBE4E4; --speaking-ink:#9E4F5C;
  --grammar:#ECE6F8; --grammar-ink:#6552A0;
  --listening:#E0EFF8; --listening-ink:#2E6A88;
  --vocabulary:#DDF6EF; --vocabulary-ink:#1F7568;
  --reading:#E8EFE1; --reading-ink:#56704D;
  --writing:#FCEBDD; --writing-ink:#9C5F2C;
  --culture:#FBF3D5; --culture-ink:#846C22;
  --tests:#F0EAF1; --tests-ink:#6C5A70;
  --general:#EEF0EC; --general-ink:#56605A;
  --script:'Dancing Script',cursive;
  --ui:'Comfortaa','Montserrat',system-ui,sans-serif;
  --body:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#172024; --surface:#1E292E; --surface-2:#253338; --ink:#EAF1EF; --ink-soft:#A3B1B0; --line:#30403F;
    --mint:#49E8CC; --mint-soft:#1D3B37; --teal:#7FD3D8; --teal-ink:#0E2E2B;
    --blush-line:#8C5A63; --blush-ink:#F1B9C3; --blush-bg:#2B2226; --sage-bg:#243029; --sage-line:#5E7A58; --danger:#F08C9E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
    --speaking:#42292D; --speaking-ink:#F5C3CB; --grammar:#322C45; --grammar-ink:#D4C9F5;
    --listening:#1F3542; --listening-ink:#B8DDF2; --vocabulary:#1C3B35; --vocabulary-ink:#AEEEDF;
    --reading:#27332A; --reading-ink:#C6DDBC; --writing:#3E2E22; --writing-ink:#F6CDA9;
    --culture:#3A3521; --culture-ink:#F1E1A5; --tests:#352C37; --tests-ink:#E0CFE4; --general:#2A3230; --general-ink:#CBD4CF;
  }
}
:root[data-theme="dark"]{
  --bg:#172024; --surface:#1E292E; --surface-2:#253338; --ink:#EAF1EF; --ink-soft:#A3B1B0; --line:#30403F;
  --mint:#49E8CC; --mint-soft:#1D3B37; --teal:#7FD3D8; --teal-ink:#0E2E2B;
  --blush-line:#8C5A63; --blush-ink:#F1B9C3; --blush-bg:#2B2226; --sage-bg:#243029; --sage-line:#5E7A58; --danger:#F08C9E;
  --speaking:#42292D; --speaking-ink:#F5C3CB; --grammar:#322C45; --grammar-ink:#D4C9F5;
  --listening:#1F3542; --listening-ink:#B8DDF2; --vocabulary:#1C3B35; --vocabulary-ink:#AEEEDF;
  --reading:#27332A; --reading-ink:#C6DDBC; --writing:#3E2E22; --writing-ink:#F6CDA9;
  --culture:#3A3521; --culture-ink:#F1E1A5; --tests:#352C37; --tests-ink:#E0CFE4; --general:#2A3230; --general-ink:#CBD4CF;
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:112.5%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.05rem;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-inner{max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;line-height:1}
.brand-img{width:118px;height:118px;flex:none;object-fit:contain}
.brand-text{display:flex;flex-direction:column}
.brand .logo{font-family:var(--script);font-weight:700;font-size:clamp(3.2rem,6.4vw,4.8rem);line-height:1.25;background:linear-gradient(120deg,var(--mint) 10%,var(--teal) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .22em .14em .04em;margin:-.1em 0 -.12em;display:inline-block;overflow:visible;white-space:nowrap}
.brand .tagline{font-family:var(--ui);font-size:.8rem;padding-left:.2em;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}
.stat-pill{font-family:var(--ui);font-weight:600;font-size:.95rem;background:var(--mint-soft);border:1px solid color-mix(in srgb,var(--mint) 55%,transparent);color:var(--ink);border-radius:999px;padding:10px 20px;display:flex;gap:14px;white-space:nowrap}
.stat-pill b{color:var(--teal);font-weight:700}
.top-actions{display:flex;gap:8px;align-items:center}

/* ---------- buttons ---------- */
.btn{border:1.5px solid transparent;border-radius:999px;padding:9px 18px;font-family:var(--ui);font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:7px;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn-primary{background:var(--mint);color:var(--teal-ink);box-shadow:var(--mint-glow)}
.btn-primary:hover{filter:brightness(.96)}
.btn-outline{background:var(--surface);border-color:var(--mint);color:var(--teal)}
.btn-outline:hover{background:var(--mint-soft)}
.btn-blush{background:var(--blush-bg);border-color:var(--blush-line);color:var(--blush-ink)}
.btn-blush:hover{filter:brightness(.97)}
.btn-icon{padding:7px;border-radius:10px;background:transparent;border:0;color:var(--ink-soft);display:inline-grid;place-items:center}
.btn-icon:hover{background:var(--surface-2);color:var(--ink)}
.btn-icon.del:hover{color:var(--danger)}

/* ---------- main tabs (pill row like chapter tabs) ---------- */
.tabs{max-width:1240px;margin:0 auto;padding:22px 24px 0;display:flex;gap:10px;overflow-x:auto}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 22px;font-family:var(--ui);font-weight:600;font-size:1.02rem;color:var(--ink-soft);display:flex;align-items:center;gap:10px;white-space:nowrap;box-shadow:var(--shadow)}
.tab .em{font-size:1.25rem}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--mint);border-color:var(--mint);color:var(--teal-ink);box-shadow:var(--mint-glow)}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:22px 24px 80px}
.view[hidden]{display:none}
.library{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.levels{position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px);display:flex;flex-direction:column;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 10px;box-shadow:var(--shadow)}
.levels h2{font-family:var(--script);font-weight:700;font-size:1.6rem;color:var(--ink);margin:0 0 6px 10px;line-height:1.1}
.level-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid transparent;background:transparent;text-align:left;padding:8px 12px;border-radius:999px;font-family:var(--ui);font-weight:600;font-size:.98rem;color:var(--ink)}
.level-btn:hover{background:var(--mint-soft)}
.level-btn[aria-pressed="true"]{background:var(--mint);color:var(--teal-ink);box-shadow:var(--mint-glow)}
.level-btn .n{font-size:.78rem;font-weight:700;opacity:.65}
.level-sep{height:1px;background:var(--line);margin:6px 12px}

.hero{background:linear-gradient(120deg,var(--surface) 55%,var(--mint-soft));border:1px solid var(--line);border-radius:24px;padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero .badge{display:inline-block;font-family:var(--script);font-weight:600;font-size:1.05rem;color:var(--teal);background:var(--mint-soft);border:1px solid color-mix(in srgb,var(--mint) 60%,transparent);border-radius:10px;padding:2px 12px}
.hero h2{margin:6px 0 0;font-family:var(--script);font-weight:700;font-size:clamp(2.2rem,4vw,2.9rem);line-height:1.1;color:var(--ink)}

.exam-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.exam-tab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-family:var(--ui);font-weight:700;font-size:1rem;display:flex;align-items:baseline;gap:8px;box-shadow:var(--shadow)}
.exam-tab small{font-weight:500;font-size:.8rem;color:var(--ink-soft)}
.exam-tab:hover{border-color:var(--mint)}
.exam-tab[aria-pressed="true"]{border-color:var(--mint);background:var(--mint);color:var(--teal-ink);box-shadow:var(--mint-glow)}
.exam-tab[aria-pressed="true"] small{color:inherit;opacity:.8}

.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-soft);width:18px;height:18px}
.search input{width:100%;padding:11px 16px 11px 44px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--ui);font-size:.98rem}
.search input:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 25%,transparent)}
.chips[hidden],.field[hidden]{display:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0}
.chip{border:1.5px solid color-mix(in srgb,var(--sk-ink) 22%,transparent);border-radius:999px;padding:6px 14px;font-family:var(--ui);font-weight:700;font-size:.86rem;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:var(--sk);color:var(--sk-ink)}
.chip[aria-pressed="true"]{border-color:var(--sk-ink);box-shadow:0 0 0 2px color-mix(in srgb,var(--sk-ink) 18%,transparent)}
.chip.all{--sk:var(--surface);--sk-ink:var(--ink)}

/* skill colour hooks */
.sk-speaking{--sk:var(--speaking);--sk-ink:var(--speaking-ink)}
.sk-grammar{--sk:var(--grammar);--sk-ink:var(--grammar-ink)}
.sk-listening{--sk:var(--listening);--sk-ink:var(--listening-ink)}
.sk-vocabulary{--sk:var(--vocabulary);--sk-ink:var(--vocabulary-ink)}
.sk-reading{--sk:var(--reading);--sk-ink:var(--reading-ink)}
.sk-writing{--sk:var(--writing);--sk-ink:var(--writing-ink)}
.sk-culture{--sk:var(--culture);--sk-ink:var(--culture-ink)}
.sk-tests{--sk:var(--tests);--sk-ink:var(--tests-ink)}
.sk-general{--sk:var(--general);--sk-ink:var(--general-ink)}

/* skill bands */
.bands{display:flex;flex-direction:column;gap:14px}
.band{background:var(--sk);border-radius:22px;padding:12px 14px 14px;border:1px solid color-mix(in srgb,var(--sk-ink) 12%,transparent)}
.band-head{display:flex;align-items:center;gap:10px;margin:0 4px 10px;color:var(--sk-ink)}
.band-head .emoji{font-size:1.25rem;line-height:1}
.band-head h3{margin:0;font-family:var(--script);font-weight:700;font-size:1.65rem;line-height:1.1}
.band-head .n{font-family:var(--ui);font-weight:700;font-size:.8rem;background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:999px;padding:2px 9px}
.band-head .add{margin-left:auto;border:1.5px solid color-mix(in srgb,var(--sk-ink) 30%,transparent);background:color-mix(in srgb,var(--surface) 75%,transparent);color:var(--sk-ink);border-radius:999px;padding:5px 12px;font-family:var(--ui);font-weight:700;font-size:.82rem;display:inline-flex;align-items:center;gap:5px}
.band-head .add:hover{background:var(--surface)}
.band-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.band-empty{margin:0 4px;color:var(--sk-ink);opacity:.8;font-family:var(--ui);font-size:.9rem}

.card{background:var(--surface);border-radius:16px;padding:11px 12px 8px 14px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow);border-left:4px solid var(--sk-ink)}
.card-top{display:flex;align-items:flex-start;gap:8px}
.card h4{margin:0;flex:1;font-family:var(--ui);font-size:1rem;font-weight:700;line-height:1.35}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-family:var(--ui);font-size:.7rem;font-weight:700;border-radius:7px;padding:2px 7px;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap}
.tag.exam{background:var(--mint-soft);color:var(--teal)}
.card .url{margin:0;font-size:.78rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .notes{margin:2px 0 0;font-size:.86rem;color:var(--ink-soft);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-actions{display:flex;align-items:center;gap:2px;margin-top:6px}
.card-actions .btn{padding:5px 13px;font-size:.8rem}
.card-actions .spacer{flex:1}

.empty{background:var(--surface);border:2px dashed var(--line);border-radius:22px;padding:36px 24px;text-align:center}
.empty h3{margin:0 0 4px;font-family:var(--script);font-weight:700;font-size:1.9rem}
.empty p{margin:0 0 14px;color:var(--ink-soft)}

/* packages & students */
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.page-head h2{margin:0;font-family:var(--script);font-weight:700;font-size:clamp(2.2rem,4vw,2.9rem);line-height:1.1}
.note-box{background:var(--sage-bg);border-left:4px solid var(--sage-line);border-radius:12px;padding:10px 16px;margin:12px 0 0;font-family:var(--ui);font-size:.95rem;color:var(--ink)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.panel h3{margin:0;font-family:var(--script);font-weight:700;font-size:1.7rem;line-height:1.15}
.panel .meta{font-family:var(--ui);color:var(--ink-soft);font-weight:600;font-size:.85rem}
.panel .notes{margin:0;color:var(--ink-soft);font-size:.92rem}
.link-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto}
.link-list li{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--sk);color:var(--sk-ink);font-family:var(--ui);font-weight:600;font-size:.86rem}
.link-list li span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-list li small{font-weight:700;opacity:.75;white-space:nowrap}
.panel-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--line);margin-top:auto}
.date{font-family:var(--ui);font-weight:700;font-size:.78rem;background:var(--blush-bg);border:1px solid var(--blush-line);border-radius:999px;padding:3px 10px;color:var(--blush-ink);white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(40,52,56,.42);display:grid;place-items:center;padding:16px}
.overlay[hidden]{display:none}
.modal{background:var(--surface);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;border-radius:26px;padding:24px}
.modal.wide{max-width:720px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h3{margin:0;font-family:var(--script);font-weight:700;font-size:2.1rem;line-height:1.1}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-family:var(--ui);font-weight:700;font-size:.9rem}
.field input,.field select,.field textarea{padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:.98rem}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--mint)}
.fields-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 14px}
.skill-pick{display:flex;flex-wrap:wrap;gap:7px}
.skill-pick label{cursor:pointer}
.skill-pick input{position:absolute;opacity:0;pointer-events:none}
.skill-pick input:checked + .chip{border-color:var(--sk-ink);box-shadow:0 0 0 2px color-mix(in srgb,var(--sk-ink) 18%,transparent)}
.skill-pick input:focus-visible + .chip{outline:3px solid var(--mint);outline-offset:2px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.picker{border:1.5px solid var(--line);border-radius:14px;max-height:300px;overflow-y:auto;padding:6px;background:var(--bg);margin-top:6px}
.picker h5{margin:8px 8px 4px;font-family:var(--ui);font-size:.8rem;color:var(--ink-soft)}
.pick-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer}
.pick-row:hover{background:var(--surface)}
.pick-row input{width:18px;height:18px;accent-color:var(--teal)}
.pick-row .t{flex:1;font-weight:600;font-size:.92rem}
.dot{font-family:var(--ui);font-size:.72rem;font-weight:700;border-radius:7px;padding:2px 8px;background:var(--sk);color:var(--sk-ink);white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 60px));visibility:hidden;background:var(--teal);color:#fff;padding:12px 22px;border-radius:999px;font-family:var(--ui);font-weight:700;font-size:.95rem;z-index:60;transition:transform .25s ease,visibility .25s;max-width:90vw}
.toast.show{transform:translate(-50%,0);visibility:visible}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

@media (max-width:1600px){ .stat-pill{display:none} }
@media (max-width:900px){
  .library{grid-template-columns:minmax(0,1fr);gap:14px}
  .library>*{min-width:0}
  .levels{position:static;flex-direction:row;overflow-x:auto;padding:8px;border-radius:999px}
  .levels h2,.level-sep{display:none}
  .level-btn{white-space:nowrap;flex:none}
  .stat-pill{display:none}
}
@media (max-width:600px){
  .top-inner{padding:10px 14px}
  .brand .logo{font-size:2.8rem}
  .brand-img{width:74px;height:74px}
  .top-actions .btn span{display:none}
  .top-actions .btn{padding:9px 11px}
  .tabs{padding:14px 12px 0}
  .tab{padding:10px 15px;font-size:.92rem}
  main{padding:14px 12px 60px}
  .band-grid,.grid-2{grid-template-columns:minmax(0,1fr)}
  .brand-img{width:74px;height:74px}
  .modal{padding:18px}
}
</style>
</head>

<script>
/* ================= configuration ================= */
const STORE_KEY = 'englishkola_hub_data';   // same key as before, so saved links carry over
const LEVELS = ['Mini','Junior','B1','B2','C1','C1+','Exam Prep','Baking with Alice','Professional English'];
const EXAMS  = ['Érettségi','FCE','CAE','Proficiency'];
const EXAM_NOTE = {'Érettségi':'Hungarian school-leaving','FCE':'B2 First','CAE':'C1 Advanced','Proficiency':'C2 Proficiency'};
const SKILLS = {
  'speaking':        {label:'Speaking',        emoji:'🗣️', cls:'sk-speaking'},
  'grammar':         {label:'Grammar',         emoji:'🧩', cls:'sk-grammar'},
  'listening':       {label:'Listening',       emoji:'🎧', cls:'sk-listening'},
  'vocabulary':      {label:'Vocabulary',      emoji:'📚', cls:'sk-vocabulary'},
  'reading':         {label:'Reading',         emoji:'📖', cls:'sk-reading'},
  'writing':         {label:'Writing',         emoji:'✍️', cls:'sk-writing'},
  'cultural corner': {label:'Cultural corner', emoji:'🌍', cls:'sk-culture'},
  'sample tests':    {label:'Sample tests',    emoji:'📝', cls:'sk-tests'},
  'general':         {label:'General',         emoji:'🔗', cls:'sk-general'}
};
const CORE = ['speaking','grammar','listening','vocabulary'];
const NO_SKILL = {'Baking with Alice':'🧁','Professional English':'💼'};  /* categories without skill sections */
const ALL_SKILLS = Object.keys(SKILLS);
function skillsFor(level){
  if (level === 'Exam Prep') return [...CORE,'reading','writing','sample tests','general'];
  return [...CORE,'reading','writing','cultural corner','general'];
}

/* ================= state ================= */
let data = {links:[],packages:[],students:[]};
let view = 'library', level = 'ALL', exam = 'ALL', skill = 'ALL';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const domain = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch(e){ return u; } };
const sk = s => SKILLS[s] || SKILLS.general;

/* ================= storage ================= */
function load(){
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) data = JSON.parse(raw); } catch(e){}
  data.links = data.links || []; data.packages = data.packages || []; data.students = data.students || [];
}
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch(e){} updateCounts(); }

function examFrom(text){
  const t = String(text||'').toLowerCase();
  if (/érettségi|erettsegi|matura/.test(t)) return 'Érettségi';
  if (/proficiency|\bcpe\b|\bc2\b/.test(t)) return 'Proficiency';
  if (/\bcae\b|advanced/.test(t)) return 'CAE';
  if (/\bfce\b|b2 first/.test(t)) return 'FCE';
  return null;
}
/* bring older saved data in line with the new structure */
function migrate(){
  let changed = false;
  data.links.forEach(l => {
    if (l.category === 'Exam Prep'){
      if (!EXAMS.includes(l.exam)){
        const fromSub = examFrom(l.subcategory);
        l.exam = fromSub || examFrom(l.title) || examFrom(l.notes) || 'FCE';
        if (fromSub) l.subcategory = 'sample tests';
        changed = true;
      }
    } else if (l.exam){ delete l.exam; changed = true; }
    if (!SKILLS[l.subcategory] || (NO_SKILL[l.category] && l.subcategory!=='general')){ l.subcategory = 'general'; changed = true; }
  });
  if (changed) save();
}
/* built-in links: Barbara's own apps + the links from the original Link Hub code */
const APP_LINKS = [
  {id:'ek-timetravellers', title:"Time Travellers' Camp (A1–A2)", url:'https://timetravellers-git-timetravellers-barbaralangszabo.vercel.app/app',
   category:'Junior', subcategory:'vocabulary', notes:'Camp app: Ancient Egypt, Ancient Rome, Medieval Knights and Castles, Mindful Voyagers — flashcards and story quizzes.'},
  {id:'ek-orderup', title:'Order Up! Restaurant role-play', url:'https://barbaralangszabo-collab.github.io/Order-Up/',
   category:'Junior', subcategory:'speaking', notes:'British-English restaurant role-play: Learn Dishes, Roleplay, Mystery Guest and Memory Game.'},
  {id:'1', title:'Junior Interactive Speaking Game', url:'https://www.britishcouncil.org', category:'Junior', subcategory:'speaking', notes:'Fun speaking activity for kids.'},
  {id:'2', title:'B1 Cultural Corner Article', url:'https://www.historic-uk.com', category:'B1', subcategory:'cultural corner', notes:'British cultural insights.'},
  {id:'3', title:'FCE Sample Tests & Listening', url:'https://www.cambridgeenglish.org', category:'Exam Prep', exam:'FCE', subcategory:'sample tests', notes:'Official mock tests.'}
];
function syncAppLinks(){
  let changed = false;
  data.removedApps = data.removedApps || [];
  APP_LINKS.slice().reverse().forEach(a=>{
    if (!data.links.some(l=>l.id===a.id || l.url===a.url) && !data.removedApps.includes(a.id)){ data.links.unshift({...a}); changed = true; }
  });
  if (changed) save();
}
function seed(){
  data.links = APP_LINKS.map(a=>({...a}));
  data.packages = [{id:'pkg-1',title:'Junior Term Bundle',notes:'Speaking and listening exercises.',linkIds:['ek-timetravellers','ek-orderup','1']}];
  data.students = [{id:'std-1',name:'Nagy Péter',date:'2026-09-01',packageId:'pkg-1',notes:'Tracking primary term bundle.'}];
  save();
}

/* ================= helpers ================= */
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}
async function copyText(text, msg){
  try { await navigator.clipboard.writeText(text); toast(msg); return; } catch(e){}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(msg); } catch(e){ toast('Copy failed — select and copy the text manually'); }
  ta.remove();
}
function updateCounts(){
  $('c-links').textContent = data.links.length;
  $('c-pkgs').textContent = data.packages.length;
  $('c-stds').textContent = data.students.length;
  $('s-links').textContent = data.links.length; $('s-pkgs').textContent = data.packages.length; $('s-stds').textContent = data.students.length;
}
const plural = (n, w) => `${n} ${w}${n===1?'':'s'}`;

/* ================= navigation ================= */
function go(v){
  view = v;
  ['library','packages','students'].forEach(x=>{
    $('view-'+x).hidden = x !== v;
    $('tab-'+x).setAttribute('aria-selected', x===v);
  });
  if (v==='library') renderLibrary();
  if (v==='packages') renderPackages();
  if (v==='students') renderStudents();
}

/* ================= library ================= */
function renderLevels(){
  const count = lv => lv==='ALL' ? data.links.length : data.links.filter(l=>l.category===lv).length;
  const btn = lv => `<button class="level-btn" data-action="level" data-level="${esc(lv)}" aria-pressed="${level===lv}">
      <span>${lv==='ALL'?'All links':esc(lv)}</span><span class="n">${count(lv)}</span></button>`;
  $('levelNav').innerHTML = `<h2>Levels</h2>${btn('ALL')}<div class="level-sep"></div>
    ${LEVELS.slice(0,6).map(btn).join('')}<div class="level-sep"></div>${LEVELS.slice(6).map(btn).join('')}`;
}
function renderExamTabs(){
  const box = $('examTabs');
  box.hidden = level !== 'Exam Prep';
  if (box.hidden) return;
  const n = e => data.links.filter(l=>l.category==='Exam Prep' && (e==='ALL'||l.exam===e)).length;
  box.innerHTML = ['ALL',...EXAMS].map(e=>`<button class="exam-tab" data-action="exam" data-exam="${esc(e)}" aria-pressed="${exam===e}">
    ${e==='ALL'?'All exams':esc(e)}<small>${e==='ALL'?plural(n(e),'link'):esc(EXAM_NOTE[e])+' · '+n(e)}</small></button>`).join('');
}
function renderChips(){
  $('skillChips').hidden = !!NO_SKILL[level];
  if (NO_SKILL[level]) return;
  const list = level==='ALL' ? ALL_SKILLS : skillsFor(level);
  $('skillChips').innerHTML = `<button class="chip all" data-action="skill" data-skill="ALL" aria-pressed="${skill==='ALL'}">All skills</button>` +
    list.map(s=>`<button class="chip ${sk(s).cls}" data-action="skill" data-skill="${esc(s)}" aria-pressed="${skill===s}"><span aria-hidden="true">${sk(s).emoji}</span>${esc(sk(s).label)}</button>`).join('');
}
function cardHTML(l){
  const tags = [];
  if (level==='ALL') tags.push(`<span class="tag">${esc(l.category)}</span>`);
  if (l.category==='Exam Prep' && l.exam && (level==='ALL' || exam==='ALL')) tags.push(`<span class="tag exam">${esc(l.exam)}</span>`);
  return `<article class="card ${sk(l.subcategory).cls}">
    <div class="card-top"><h4>${esc(l.title)}</h4>${tags.length?`<div class="card-tags">${tags.join('')}</div>`:''}</div>
    <p class="url">${esc(domain(l.url))}</p>
    ${l.notes?`<p class="notes" title="${esc(l.notes)}">${esc(l.notes)}</p>`:''}
    <div class="card-actions">
      <a class="btn btn-primary" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${icon('open')}Open</a>
      <span class="spacer"></span>
      <button class="btn-icon" data-action="copy-link" data-id="${esc(l.id)}" aria-label="Copy link" title="Copy link">${icon('copy')}</button>
      <button class="btn-icon" data-action="edit-link" data-id="${esc(l.id)}" aria-label="Edit ${esc(l.title)}" title="Edit">${icon('edit')}</button>
      <button class="btn-icon del" data-action="del-link" data-id="${esc(l.id)}" aria-label="Delete ${esc(l.title)}" title="Delete">${icon('trash')}</button>
    </div></article>`;
}
function renderLibrary(){
  renderLevels(); renderExamTabs(); renderChips();
  const q = $('searchInput').value.trim().toLowerCase();
  const inScope = data.links.filter(l =>
    (level==='ALL' || l.category===level) &&
    (level!=='Exam Prep' || exam==='ALL' || l.exam===exam));
  const shown = inScope.filter(l =>
    (skill==='ALL' || l.subcategory===skill) &&
    (!q || [l.title,l.notes,l.subcategory,l.category,l.exam,l.url].some(v=>String(v||'').toLowerCase().includes(q))));

  const order = level==='ALL' ? ALL_SKILLS : skillsFor(level);
  const specific = level!=='ALL' && !(level==='Exam Prep' && exam==='ALL');
  const catBand = (cat, items) => `<section class="band sk-general">
      <div class="band-head"><span class="emoji" aria-hidden="true">${NO_SKILL[cat]}</span><h3>${esc(cat)}</h3>
        <span class="n">${items.length}</span>
        <button class="add" data-action="add-link" data-level="${esc(cat)}" data-skill="general">${icon('plus')}Add</button></div>
      ${items.length ? `<div class="band-grid">${items.map(cardHTML).join('')}</div>`
                     : `<p class="band-empty">No links here yet.</p>`}
    </section>`;
  let bands = '';
  if (NO_SKILL[level]){
    bands = (shown.length || !q) ? catBand(level, shown) : '';
  } else {
    bands = order.filter(s => skill==='ALL' || s===skill).map(s=>{
      const items = shown.filter(l=>l.subcategory===s && !NO_SKILL[l.category]);
      const showEmpty = !q && specific && (CORE.includes(s) || skill===s);
      if (!items.length && !showEmpty) return '';
      const S = sk(s);
      return `<section class="band ${S.cls}">
      <div class="band-head"><span class="emoji" aria-hidden="true">${S.emoji}</span><h3>${esc(S.label)}</h3>
        <span class="n">${items.length}</span>
        <button class="add" data-action="add-link" data-skill="${esc(s)}">${icon('plus')}Add</button></div>
      ${items.length ? `<div class="band-grid">${items.map(cardHTML).join('')}</div>`
                     : `<p class="band-empty">No ${esc(S.label.toLowerCase())} links here yet.</p>`}
    </section>`;
    }).join('');
    if (level==='ALL' && skill==='ALL'){
      Object.keys(NO_SKILL).forEach(cat=>{ const items = shown.filter(l=>l.category===cat); if (items.length) bands += catBand(cat, items); });
    }
  }

  $('bands').innerHTML = bands || `<div class="empty"><h3>No links match</h3>
    <p>${q?'Try a different search, or clear the skill filter.':'Add the first link for this category.'}</p>
    <button class="btn btn-primary" data-action="add-link">${icon('plus')}Add link</button></div>`;
}

/* ================= link modal ================= */
function openModal(id){ $(id).hidden = false; const f = $(id).querySelector('input:not([type=hidden]),select'); if (f) setTimeout(()=>f.focus(),30); }
function closeAll(){ document.querySelectorAll('.overlay').forEach(o=>o.hidden=true); }

function fillSkillPicker(selected){
  const lv = $('fLevel').value;
  const list = skillsFor(lv);
  if (!list.includes(selected)) selected = list[0];
  $('fSkills').innerHTML = list.map(s=>`<label><input type="radio" name="fSkill" value="${esc(s)}" ${s===selected?'checked':''}>
    <span class="chip ${sk(s).cls}"><span aria-hidden="true">${sk(s).emoji}</span>${esc(sk(s).label)}</span></label>`).join('');
}
function toggleExamField(){ $('fExamWrap').hidden = $('fLevel').value !== 'Exam Prep'; $('fSkillWrap').hidden = !!NO_SKILL[$('fLevel').value]; }
function openLinkModal(link, preset={}){
  $('linkForm').reset();
  $('fId').value = link ? link.id : '';
  $('mLinkTitle').textContent = link ? 'Edit link' : 'Add link';
  $('fLevel').value = link ? link.category : (preset.level || (level!=='ALL'?level:'B1'));
  $('fExam').value  = link?.exam || preset.exam || (exam!=='ALL'?exam:'Érettségi');
  if (link){ $('fTitle').value = link.title; $('fUrl').value = link.url; $('fNotes').value = link.notes || ''; }
  toggleExamField();
  fillSkillPicker(link ? link.subcategory : (preset.skill || (skill!=='ALL'?skill:'speaking')));
  openModal('mLink');
}
function saveLink(e){
  e.preventDefault();
  const id = $('fId').value || String(Date.now());
  const cat = $('fLevel').value;
  const l = {
    id, title:$('fTitle').value.trim(), url:$('fUrl').value.trim(), category:cat,
    subcategory: NO_SKILL[cat] ? 'general' : ((document.querySelector('input[name=fSkill]:checked')||{}).value || 'general'),
    notes:$('fNotes').value.trim()
  };
  if (cat==='Exam Prep') l.exam = $('fExam').value;
  const i = data.links.findIndex(x=>x.id===id);
  if (i>=0) data.links[i] = l; else data.links.unshift(l);
  save(); closeAll(); renderLibrary();
  toast(i>=0 ? 'Link updated' : 'Link saved');
}

/* ================= packages ================= */
function linksOf(pkg){ return (pkg?.linkIds||[]).map(id=>data.links.find(l=>l.id===id)).filter(Boolean); }
function listHTML(items){
  return `<ul class="link-list">${items.map(l=>`<li class="${sk(l.subcategory).cls}"><span aria-hidden="true">${NO_SKILL[l.category] || sk(l.subcategory).emoji}</span>
    <span class="t">${esc(l.title)}</span><small>${esc(l.category==='Exam Prep'&&l.exam?l.exam:l.category)}</small></li>`).join('')}</ul>`;
}
function renderPackages(){
  const g = $('pkgGrid');
  if (!data.packages.length){
    g.innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>No packages yet</h3><p>Combine library links into a term bundle.</p>
      <button class="btn btn-primary" data-action="new-package">${icon('plus')}Create package</button></div>`; return;
  }
  g.innerHTML = data.packages.map(p=>{
    const items = linksOf(p);
    const used = data.students.filter(s=>s.packageId===p.id).length;
    return `<article class="panel">
      <h3>${esc(p.title)}</h3>
      <span class="meta">${plural(items.length,'link')} · assigned to ${plural(used,'student')}</span>
      ${p.notes?`<p class="notes">${esc(p.notes)}</p>`:''}
      ${listHTML(items)}
      <div class="panel-actions">
        <button class="btn btn-outline" data-action="copy-pkg" data-id="${esc(p.id)}">${icon('copy')}Copy all links</button>
        <button class="btn-icon del" data-action="del-pkg" data-id="${esc(p.id)}" aria-label="Delete package">${icon('trash')}</button>
      </div></article>`;
  }).join('');
}
function renderPicker(){
  const q = $('pFilter').value.trim().toLowerCase();
  const checked = new Set([...document.querySelectorAll('input[name=pkgLinks]:checked')].map(i=>i.value));
  const groups = LEVELS.map(lv=>{
    const items = data.links.filter(l=>l.category===lv && (!q || (l.title+' '+l.subcategory+' '+(l.exam||'')).toLowerCase().includes(q)));
    if (!items.length) return '';
    return `<h5>${esc(lv)}</h5>` + items.map(l=>`<label class="pick-row"><input type="checkbox" name="pkgLinks" value="${esc(l.id)}" ${checked.has(l.id)?'checked':''}>
      <span class="t">${esc(l.title)}</span>${l.exam?`<span class="tag exam">${esc(l.exam)}</span>`:''}${NO_SKILL[l.category] ? '' : `<span class="dot ${sk(l.subcategory).cls}">${esc(sk(l.subcategory).label)}</span>`}</label>`).join('');
  }).join('');
  // keep hidden checked items so they're not lost when filtering
  const hidden = [...checked].filter(id=>!groups.includes(`value="${id}"`)).map(id=>`<input type="checkbox" name="pkgLinks" value="${esc(id)}" checked hidden>`).join('');
  $('pPicker').innerHTML = (groups || `<p style="margin:10px;color:var(--ink-soft)">No links match.</p>`) + hidden;
  updatePickCount();
}
function updatePickCount(){ const n = document.querySelectorAll('input[name=pkgLinks]:checked').length; $('pCount').textContent = n ? `(${n} selected)` : ''; }
function savePackage(e){
  e.preventDefault();
  const ids = [...document.querySelectorAll('input[name=pkgLinks]:checked')].map(i=>i.value);
  if (!ids.length){ toast('Select at least one link'); return; }
  data.packages.unshift({id:'pkg-'+Date.now(),title:$('pTitle').value.trim(),notes:$('pNotes').value.trim(),linkIds:ids});
  save(); closeAll(); renderPackages(); toast('Package created');
}

/* ================= students ================= */
function renderStudents(){
  const g = $('stdGrid');
  if (!data.students.length){
    g.innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>No students yet</h3><p>Assign a package to a student to start tracking.</p>
      <button class="btn btn-primary" data-action="new-student">${icon('plus')}Assign package</button></div>`; return;
  }
  g.innerHTML = data.students.map(s=>{
    const p = data.packages.find(x=>x.id===s.packageId);
    const items = linksOf(p);
    return `<article class="panel">
      <div class="row"><h3>${esc(s.name)}</h3><span class="date">${esc(s.date)}</span></div>
      <span class="meta">${p?esc(p.title):'Package deleted'} · ${plural(items.length,'link')}</span>
      ${s.notes?`<p class="notes">${esc(s.notes)}</p>`:''}
      ${items.length?listHTML(items):''}
      <div class="panel-actions">
        <button class="btn btn-outline" data-action="copy-std" data-id="${esc(s.id)}" ${items.length?'':'disabled'}>${icon('copy')}Copy student's links</button>
        <button class="btn-icon del" data-action="del-std" data-id="${esc(s.id)}" aria-label="Remove student">${icon('trash')}</button>
      </div></article>`;
  }).join('');
}
function saveStudent(e){
  e.preventDefault();
  if (!$('sPkg').value){ toast('Choose a package first'); return; }
  data.students.unshift({id:'std-'+Date.now(),name:$('sName').value.trim(),date:$('sDate').value,packageId:$('sPkg').value,notes:$('sNotes').value.trim()});
  save(); closeAll(); renderStudents(); toast('Package assigned');
}

/* ================= events ================= */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]'); if (!t) return;
  const a = t.dataset.action, id = t.dataset.id;
  if (a==='go') go(t.dataset.view);
  else if (a==='level'){ level = t.dataset.level; exam='ALL'; skill='ALL'; renderLibrary(); }
  else if (a==='exam'){ exam = t.dataset.exam; renderLibrary(); }
  else if (a==='skill'){ skill = t.dataset.skill; renderLibrary(); }
  else if (a==='add-link') openLinkModal(null,{skill:t.dataset.skill, level:t.dataset.level});
  else if (a==='edit-link') openLinkModal(data.links.find(l=>l.id===id));
  else if (a==='copy-link'){ const l=data.links.find(x=>x.id===id); if(l) copyText(l.url,'Link copied'); }
  else if (a==='del-link'){ if (confirm('Delete this link? It will also be removed from any packages.')){ if (APP_LINKS.some(a=>a.id===id)){ data.removedApps=[...(data.removedApps||[]),id]; } data.links=data.links.filter(l=>l.id!==id); data.packages.forEach(p=>p.linkIds=(p.linkIds||[]).filter(x=>x!==id)); save(); renderLibrary(); toast('Link deleted'); } }
  else if (a==='new-package'){ $('pkgForm').reset(); $('pPicker').innerHTML=''; renderPicker(); openModal('mPkg'); }
  else if (a==='copy-pkg'){ const p=data.packages.find(x=>x.id===id); copyText(linksOf(p).map(l=>`${l.title}: ${l.url}`).join('\n'),'Package links copied'); }
  else if (a==='del-pkg'){ if (confirm('Delete this package?')){ data.packages=data.packages.filter(p=>p.id!==id); save(); renderPackages(); toast('Package deleted'); } }
  else if (a==='new-student'){
    if (!data.packages.length){ toast('Create a package first'); go('packages'); return; }
    $('stdForm').reset(); $('sDate').value = new Date().toISOString().slice(0,10);
    $('sPkg').innerHTML = `<option value="">Choose a package…</option>` + data.packages.map(p=>`<option value="${esc(p.id)}">${esc(p.title)}</option>`).join('');
    openModal('mStd');
  }
  else if (a==='copy-std'){ const s=data.students.find(x=>x.id===id); const p=data.packages.find(x=>x.id===s?.packageId); copyText(linksOf(p).map(l=>`${l.title}: ${l.url}`).join('\n'),`Links for ${s.name} copied`); }
  else if (a==='del-std'){ if (confirm('Remove this student record?')){ data.students=data.students.filter(s=>s.id!==id); save(); renderStudents(); toast('Student removed'); } }
  else if (a==='close') closeAll();
});
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{ if (e.target===o) closeAll(); }));
document.addEventListener('keydown',e=>{ if (e.key==='Escape') closeAll(); });
$('searchInput').addEventListener('input', renderLibrary);
$('fLevel').addEventListener('change',()=>{ toggleExamField(); fillSkillPicker((document.querySelector('input[name=fSkill]:checked')||{}).value); });
$('pFilter').addEventListener('input', renderPicker);
$('pPicker').addEventListener('change', updatePickCount);
$('linkForm').addEventListener('submit', saveLink);
$('pkgForm').addEventListener('submit', savePackage);
$('stdForm').addEventListener('submit', saveStudent);

/* ================= start ================= */
$('fLevel').innerHTML = LEVELS.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join('');
$('fExam').innerHTML  = EXAMS.map(x=>`<option value="${esc(x)}">${esc(x)} (${esc(EXAM_NOTE[x])})</option>`).join('');
load();
if (!data.links.length && !data.packages.length) seed();
migrate(); syncAppLinks(); updateCounts(); go('library');
</script>
</body>
</html>
